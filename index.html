<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebrew Transliteration Engine</title>
</head>

<body>

  <h1>Hebrew Transliteration Engine</h1>

  <div id="status">
    Checking registration...
  </div>

  <div id="registrationSection" style="display:none;">

    <h2>Registration</h2>

    <p>
      Enter your email address and OpenAI API key.
    </p>

    <div>
      <label for="emailInput">Email Address</label><br>
      <input
        type="text"
        id="emailInput"
        autocomplete="email"
      >
    </div>

    <br>

    <div>
      <label for="apiKeyInput">OpenAI API Key</label><br>
      <input
        type="password"
        id="apiKeyInput"
        autocomplete="off"
      >
    </div>

    <br>

    <div id="termsSection">

      <h3>Terms of Use</h3>

      <p>
        This is temporary text for testing the
        user-acceptance process.
      </p>

      <p>
        You must accept the terms of use before
        continuing to the Transliteration Engine.
      </p>

      <label>
        <input
          type="checkbox"
          id="acceptTerms"
        >
        I accept the Terms of Use.
      </label>

    </div>

    <br>

    <div
      id="otpSection"
      style="display:none;"
    >
      <label for="otpInput">
        Verification Code
      </label>
      <br>

      <input
        type="text"
        id="otpInput"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <br><br>

      <button
        type="button"
        id="verifyOtpButton"
      >
        Verify Code
      </button>
    </div>

    <br>

    <button
      type="button"
      id="registerButton"
    >
      Continue
    </button>

  </div>

  <script>

    const API_BASE =
      "https://transliterationengine.onrender.com";

    const status =
      document.getElementById("status");

    const registrationSection =
      document.getElementById(
        "registrationSection"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );


    async function checkSession() {
      try {
        const response =
          await fetch(
            API_BASE + "/session",
            {
              method: "GET",
              credentials: "include"
            }
          );

        const result =
          await response.json();

        if (result.authenticated) {
          status.textContent =
            "Registration found. Opening application...";

          window.location.href =
            "TransliterationEngine.html";

          return;
        }

      } catch (error) {
        console.error(
          "Session check failed:",
          error
        );
      }

      status.textContent =
        "Registration required.";

      registrationSection.style.display =
        "block";
    }


    async function completeRegistration(
      email,
      apiKey,
      acceptedTerms,
      accessToken
    ) {
      const response =
        await fetch(
          API_BASE + "/register",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              email,
              apiKey,
              acceptedTerms,
              accessToken
            })
          }
        );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.message ||
          result.error ||
          "Registration failed."
        );
      }

      status.textContent =
        "Registration successful. Opening application...";

      window.location.href =
        "TransliterationEngine.html";
    }


    registerButton.addEventListener(
      "click",
      async function () {
        const email =
          document
            .getElementById("emailInput")
            .value
            .trim();

        const apiKey =
          document
            .getElementById("apiKeyInput")
            .value
            .trim();

        const acceptedTerms =
          document
            .getElementById("acceptTerms")
            .checked;

        if (!acceptedTerms) {
          status.textContent =
            "You must accept the Terms of Use before continuing.";

          return;
        }

        status.textContent =
          "Checking registration...";

        try {
          const response =
            await fetch(
              API_BASE + "/auth/start",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  email
                })
              }
            );

          const result =
            await response.json();

          if (!response.ok) {
            throw new Error(
              result.message ||
              "Unable to start registration."
            );
          }

          if (result.bypass) {
            status.textContent =
              "Continuing...";

            await completeRegistration(
              email,
              apiKey,
              acceptedTerms,
              null
            );

            return;
          }

          document.getElementById(
            "otpSection"
          ).style.display =
            "block";

          status.textContent =
            "A verification code has been sent to your email address.";

        } catch (error) {
          console.error(
            "Registration start failed:",
            error
          );

          status.textContent =
            error.message;
        }
      }
    );


    document
      .getElementById("verifyOtpButton")
      .addEventListener(
        "click",
        async function () {
          const email =
            document
              .getElementById("emailInput")
              .value
              .trim();

          const apiKey =
            document
              .getElementById("apiKeyInput")
              .value
              .trim();

          const acceptedTerms =
            document
              .getElementById("acceptTerms")
              .checked;

          const token =
            document
              .getElementById("otpInput")
              .value
              .trim();

          if (!token) {
            status.textContent =
              "Enter the verification code sent to your email address.";

            return;
          }

          status.textContent =
            "Verifying email address...";

          try {
            const response =
              await fetch(
                API_BASE + "/auth/verify",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  credentials: "include",

                  body: JSON.stringify({
                    email,
                    token
                  })
                }
              );

            const result =
              await response.json();

            if (!response.ok) {
              throw new Error(
                result.message ||
                "Verification failed."
              );
            }

            await completeRegistration(
              email,
              apiKey,
              acceptedTerms,
              result.accessToken
            );

          } catch (error) {
            console.error(
              "Email verification failed:",
              error
            );

            status.textContent =
              error.message;
          }
        }
      );


    checkSession();

  </script>

</body>
</html>
