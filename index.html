<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebrew Transliteration Engine</title>
</head>

<body>

  <h1>Hebrew Transliteration Engine</h1>

  <div id="status">
    Checking registration...
  </div>

  <div id="registrationSection" style="display:none;">

    <h2>Registration</h2>

    <p>
      Enter your email address and OpenAI API key.
    </p>

    <div>
      <label for="emailInput">Email Address</label><br>
      <input
        type="text"
        id="emailInput"
        autocomplete="email"
      >
    </div>

    <br>

    <div>
      <label for="apiKeyInput">OpenAI API Key</label><br>
      <input
        type="password"
        id="apiKeyInput"
        autocomplete="off"
      >
    </div>

    <br>

    <button id="registerButton">
      Register and Continue
    </button>

  </div>

  <script>

    const API_BASE =
      "https://transliterationengine.onrender.com";

    const status =
      document.getElementById("status");

    const registrationSection =
      document.getElementById(
        "registrationSection"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    async function checkSession() {

      try {

        const response =
          await fetch(
            API_BASE + "/session",
            {
              method: "GET",
              credentials: "include"
            }
          );

        const result =
          await response.json();

        if (result.authenticated) {

          status.textContent =
            "Registration found. Opening application...";

          window.location.href =
            "TransliterationEngine.html";

          return;
        }

      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );
      }

      status.textContent =
        "Registration required.";

      registrationSection.style.display =
        "block";
    }


    registerButton.addEventListener(
      "click",
      async function () {

        const email =
          document
            .getElementById("emailInput")
            .value
            .trim();

        const apiKey =
          document
            .getElementById("apiKeyInput")
            .value
            .trim();

        status.textContent =
          "Registering...";

        try {

          const response =
            await fetch(
              API_BASE + "/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  email,
                  apiKey
                })
              }
            );

          const result =
            await response.json();

          if (!response.ok) {

            throw new Error(
              result.error ||
              "Registration failed."
            );
          }

          status.textContent =
            "Registration successful. Opening application...";

          window.location.href =
            "TransliterationEngine.html";

        } catch (error) {

          console.error(
            "Registration failed:",
            error
          );

          status.textContent =
            error.message;
        }
      }
    );


    checkSession();

  </script>

</body>
</html>
