<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebrew Transliteration Engine</title>
</head>

<body>

  <h1>Hebrew Transliteration Engine</h1>

  <div id="status">
    Checking registration...
  </div>

  <div id="registrationSection" style="display:none;">

    <h2>Registration</h2>

    <p id="registrationInstructions">
      Enter your email address to continue.
    </p>

    <div id="emailSection">
      <label for="emailInput">Email Address</label><br>
      <input
        type="text"
        id="emailInput"
        autocomplete="email"
      >
    </div>

    <br>

    <div id="apiKeySection" style="display:none;">
      <label for="apiKeyInput">OpenAI API Key</label><br>
      <input
        type="password"
        id="apiKeyInput"
        autocomplete="off"
      >
    </div>

    <br>

    <div id="termsSection" style="display:none;">

      <h3>Terms of Use</h3>

      <p>
        This is temporary text for testing the
        user-acceptance process.
      </p>

      <p>
        You must accept the terms of use before
        continuing to the Transliteration Engine.
      </p>

      <label>
        <input
          type="checkbox"
          id="acceptTerms"
        >
        I accept the Terms of Use.
      </label>

    </div>

    <br>

    <button
      type="button"
      id="registerButton"
    >
      Continue
    </button>

  </div>

  <script>

    const API_BASE =
      "https://transliterationengine.onrender.com";

    const status =
      document.getElementById("status");

    const registrationSection =
      document.getElementById(
        "registrationSection"
      );

    const registrationInstructions =
      document.getElementById(
        "registrationInstructions"
      );

    const emailSection =
      document.getElementById(
        "emailSection"
      );

    const emailInput =
      document.getElementById(
        "emailInput"
      );

    const apiKeySection =
      document.getElementById(
        "apiKeySection"
      );

    const apiKeyInput =
      document.getElementById(
        "apiKeyInput"
      );

    const termsSection =
      document.getElementById(
        "termsSection"
      );

    const acceptTerms =
      document.getElementById(
        "acceptTerms"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    let verifiedAccessToken = null;
    let verifiedEmail = null;
    let newUserRegistration = false;


    function clearAuthFragment() {
      if (!window.location.hash) {
        return;
      }

      window.history.replaceState(
        null,
        "",
        window.location.pathname +
          window.location.search
      );
    }


    function getAccessTokenFromUrl() {
      const hash =
        String(
          window.location.hash || ""
        );

      if (!hash.startsWith("#")) {
        return null;
      }

      const params =
        new URLSearchParams(
          hash.substring(1)
        );

      return (
        params.get("access_token") ||
        null
      );
    }


    async function checkSession() {
      try {
        const response =
          await fetch(
            API_BASE + "/session",
            {
              method: "GET",
              credentials: "include"
            }
          );

        const result =
          await response.json();

        if (result.authenticated) {
          status.textContent =
            "Registration found. Opening application...";

          window.location.href =
            "TransliterationEngine.html";

          return true;
        }

      } catch (error) {
        console.error(
          "Session check failed:",
          error
        );
      }

      status.textContent =
        "Registration required.";

      registrationSection.style.display =
        "block";

      return false;
    }


    async function completeRegistration(
      email,
      apiKey,
      acceptedTermsValue,
      accessToken
    ) {
      const response =
        await fetch(
          API_BASE + "/register",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              email,
              apiKey,
              acceptedTerms:
                acceptedTermsValue,
              accessToken
            })
          }
        );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.message ||
          result.error ||
          "Registration failed."
        );
      }

      status.textContent =
        "Registration successful. Opening application...";

      window.location.href =
        "TransliterationEngine.html";
    }


    async function processMagicLinkReturn(
      accessToken
    ) {
      status.textContent =
        "Verifying sign-in...";

      try {
        const response =
          await fetch(
            API_BASE + "/auth/status",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials: "include",

              body: JSON.stringify({
                accessToken
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            "Unable to verify sign-in."
          );
        }

        verifiedAccessToken =
          accessToken;

        verifiedEmail =
          String(
            result.email || ""
          )
            .trim()
            .toLowerCase();

        clearAuthFragment();

        if (!verifiedEmail) {
          throw new Error(
            "Verified email address was not returned."
          );
        }

        if (result.existingUser) {
          await completeRegistration(
            verifiedEmail,
            "",
            false,
            verifiedAccessToken
          );

          return;
        }

        newUserRegistration =
          true;

        emailInput.value =
          verifiedEmail;

        emailInput.readOnly =
          true;

        emailSection.style.display =
          "block";

        apiKeySection.style.display =
          "block";

        termsSection.style.display =
          "block";

        registrationSection.style.display =
          "block";

        registrationInstructions.textContent =
          "New registration. Enter your OpenAI API key and accept the Terms of Use.";

        status.textContent =
          "Email verified.";

      } catch (error) {
        console.error(
          "Magic-link verification failed:",
          error
        );

        clearAuthFragment();

        verifiedAccessToken =
          null;

        verifiedEmail =
          null;

        newUserRegistration =
          false;

        status.textContent =
          error.message;

        registrationSection.style.display =
          "block";
      }
    }


    registerButton.addEventListener(
      "click",
      async function () {

        if (newUserRegistration) {
          const apiKey =
            apiKeyInput.value.trim();

          const acceptedTermsValue =
            acceptTerms.checked;

          if (!apiKey) {
            status.textContent =
              "Enter your OpenAI API key.";

            return;
          }

          if (!acceptedTermsValue) {
            status.textContent =
              "You must accept the Terms of Use before continuing.";

            return;
          }

          try {
            await completeRegistration(
              verifiedEmail,
              apiKey,
              acceptedTermsValue,
              verifiedAccessToken
            );

          } catch (error) {
            console.error(
              "Registration failed:",
              error
            );

            status.textContent =
              error.message;
          }

          return;
        }

        const email =
          emailInput.value
            .trim();

        if (!email) {
          status.textContent =
            "Enter your email address.";

          return;
        }

        status.textContent =
          "Checking registration...";

        try {
          const response =
            await fetch(
              API_BASE + "/auth/start",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  email
                })
              }
            );

          const result =
            await response.json();

          if (!response.ok) {
            throw new Error(
              result.message ||
              "Unable to start registration."
            );
          }

          if (result.bypass) {
            status.textContent =
              "Continuing...";

            await completeRegistration(
              email,
              "",
              false,
              null
            );

            return;
          }

          status.textContent =
            "Check your email and click the sign-in link to continue.";

        } catch (error) {
          console.error(
            "Registration start failed:",
            error
          );

          status.textContent =
            error.message;
        }
      }
    );


    async function initializePage() {
      const accessToken =
        getAccessTokenFromUrl();

      if (accessToken) {
        await processMagicLinkReturn(
          accessToken
        );

        return;
      }

      await checkSession();
    }


    initializePage();

  </script>

</body>
</html>
